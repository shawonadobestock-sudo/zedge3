name: Test Facebook Attachment Sending

on:
  workflow_dispatch:

jobs:
  test-sending:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        shell: pwsh
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Create test script
        shell: pwsh
        run: |
          @'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          async function sendFacebookNotification(message) {
            const token = "EAASk1dgl5aIBRmpwb76F9wMCVc6S4Acd3ZC6Ibv5PkyJ1SN9fGuUnzPXyUBiZBvP30EgRqis5lfuAPK6hJ1yeqWHDQZBnhLkyr9VdxkKkoeU7W1pzlBAZC93ZAqZChNrrtgwXI0l0D30WBV53wUINdTrSi8vQ0y8mi5ygTBysBlUkNBvKPnmY9PZBg5qOroV8CVzxyCre4PagZDZD";
            const psid = "27204362879257816";
            try {
              const url = `https://graph.facebook.com/v20.0/me/messages?access_token=${token}`;
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  recipient: { id: psid },
                  message: { text: message }
                })
              });
              if (!res.ok) {
                const errText = await res.text().catch(() => "");
                console.log(`Facebook Graph API response failed: HTTP ${res.status} - ${errText}`);
              } else {
                console.log("Facebook notification successfully sent via Graph API.");
              }
            } catch (err) {
              console.log(`Error sending Facebook notification: ${err.message}`);
            }
          }

          async function sendFacebookAttachment(filePath, type = "image") {
            const token = "EAASk1dgl5aIBRmpwb76F9wMCVc6S4Acd3ZC6Ibv5PkyJ1SN9fGuUnzPXyUBiZBvP30EgRqis5lfuAPK6hJ1yeqWHDQZBnhLkyr9VdxkKkoeU7W1pzlBAZC93ZAqZChNrrtgwXI0l0D30WBV53wUINdTrSi8vQ0y8mi5ygTBysBlUkNBvKPnmY9PZBg5qOroV8CVzxyCre4PagZDZD";
            const psid = "27204362879257816";
            try {
              if (!fs.existsSync(filePath)) {
                console.log(`Facebook attachment file not found: ${filePath}`);
                return;
              }
              const fileBuffer = fs.readFileSync(filePath);
              const blob = new Blob([fileBuffer]);
              const formData = new FormData();
              formData.append("recipient", JSON.stringify({ id: psid }));
              formData.append("message", JSON.stringify({
                attachment: {
                  type: type,
                  payload: { is_reusable: true }
                }
              }));
              formData.append("filedata", blob, path.basename(filePath));

              const url = `https://graph.facebook.com/v20.0/me/messages?access_token=${token}`;
              const res = await fetch(url, {
                method: "POST",
                body: formData
              });
              if (!res.ok) {
                const errText = await res.text().catch(() => "");
                console.log(`Facebook attachment (${type}) send failed: HTTP ${res.status} - ${errText}`);
              } else {
                console.log(`Facebook attachment (${type}) successfully sent.`);
              }
            } catch (err) {
              console.log(`Error sending Facebook attachment (${type}): ${err.message}`);
            }
          }

          (async () => {
            let browser = null;
            let context = null;
            try {
              console.log("Launching browser...");
              browser = await chromium.launch({ headless: true });
              context = await browser.newContext({
                viewport: { width: 1280, height: 720 },
                recordVideo: { dir: "videos/", size: { width: 1280, height: 720 } }
              });

              const page = await context.newPage();
              console.log("Navigating to facebook.com...");
              await page.goto("https://facebook.com", { waitUntil: "domcontentloaded" });
              await page.waitForTimeout(2000);

              const screenshotPath = "test-screenshot.png";
              console.log("Taking test screenshot...");
              await page.screenshot({ path: screenshotPath });

              console.log("Sending test screenshot via Facebook...");
              await sendFacebookAttachment(screenshotPath, "image");

              console.log("Finalizing video...");
              let savedVideoPath = "";
              const pages = context.pages();
              if (pages.length > 0) {
                const videoPath = await pages[0].video()?.path();
                if (videoPath) {
                  console.log(`✅ Video file located at: ${videoPath}`);
                  savedVideoPath = videoPath;
                }
              }

              await context.close();
              await new Promise(resolve => setTimeout(resolve, 2000));
              console.log("Video file written to disk.");

              if (savedVideoPath) {
                console.log("Sending video via Facebook...");
                await sendFacebookAttachment(savedVideoPath, "video");
              }

              await browser.close();
              await sendFacebookNotification("Facebook test completed successfully!");
              console.log("Done!");
            } catch (err) {
              console.error("Test error:", err);
              if (context) await context.close().catch(() => {});
              if (browser) await browser.close().catch(() => {});
            }
          })();
          '@ | Set-Content test_bot.js

      - name: Run Facebook test
        run: node test_bot.js
